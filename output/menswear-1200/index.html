<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>男装服饰集</title><style>body{margin:0;background:#f5f4f1;color:#262626;font:15px system-ui}header,main{max-width:1450px;margin:auto;padding:24px}h1{margin:0;font-size:28px}p{color:#666}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #d8d5ce;background:white;padding:9px 17px;border-radius:24px;cursor:pointer}button.active{background:#253b36;color:white}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}article{background:white;border-radius:12px;overflow:hidden}article img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}article div{padding:12px}a{color:#365d51}article p{font-size:12px;margin:8px 0}small{color:#777}</style><header><h1>男装服饰集</h1><p id="status"></p><nav id="filters"></nav></header><main id="grid"></main><script src="gallery-data.js"></script><script>const d=window.MENSWEAR;let category='全部';document.querySelector('#status').textContent='已生成 '+d.progress.completed+' / '+d.progress.target+' 张。仅展示实际生成并保存的图片。';const nav=document.querySelector('#filters'),grid=document.querySelector('#grid');function render(){nav.replaceChildren();for(const c of ['全部',...d.progress.categories.map(c=>c.category)]){const b=document.createElement('button');b.textContent=c;b.className=category===c?'active':'';b.onclick=()=>{category=c;render()};nav.append(b)}grid.replaceChildren();for(const i of d.items.filter(i=>category==='全部'||i.category===category)){const a=document.createElement('article'),link=document.createElement('a'),img=document.createElement('img'),body=document.createElement('div'),label=document.createElement('strong'),desc=document.createElement('p'),prompt=document.createElement('a');link.href=i.image;link.target='_blank';img.src=i.thumbnail;img.alt=i.name;img.loading='lazy';link.append(img);label.textContent=i.id+' · '+i.category;desc.textContent=i.description;prompt.href=i.prompt;prompt.textContent='提示词';prompt.target='_blank';body.append(label,desc,prompt);a.append(link,body);grid.append(a)}}render();</script></html>
