name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate the seed file
        run: node scripts/seed.mjs --dry-run > /dev/null

      - name: Check migrations are ordered and unique
        run: |
          duplicates=$(ls migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate migration prefixes: $duplicates"
            exit 1
          fi
